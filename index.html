<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee">
<title>Mat – plan og handleliste</title>
<meta name="description" content="Ukeplan, oppskrifter, handleliste og tilbud – proteinrik hverdagsmat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#0f1512;--mut:#47515a;--line:#cfd6d1;--acc:#17703f;--onacc:#fff;--accbg:#dcf2e5;--amb:#9a5200;--ambbg:#fdebd0;--red:#b3261e;--redbg:#fde3e1;--skip:#4b5563;--skipbg:#e5e8eb;--star:#e59a00;--tb:68px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f0d;--card:#161c19;--ink:#f4f7f5;--mut:#aab5af;--line:#2f3a35;--acc:#4cc986;--onacc:#05170d;--accbg:#173a28;--amb:#f2b04a;--ambbg:#3a2a10;--red:#ff8d84;--redbg:#3d1b18;--skip:#b9c2bd;--skipbg:#262e2a;--star:#ffb81f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--tb) + env(safe-area-inset-bottom) + 90px)}
body.nos{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1.5rem;line-height:1.15;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
h2{font-size:1.3rem;line-height:1.2;margin:0 0 4px}
button{font:inherit;color:inherit}
.sheet{scroll-margin-top:12px}
.btn,.sheet,.card,input,textarea,.it,.wk,.star,.picbtn{scroll-margin-bottom:calc(var(--tb) + 110px)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1.08rem;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--onacc);min-height:64px;font-size:1.2rem}
.btn.alt{border-color:var(--amb);color:var(--amb)}
.btn.skip{color:var(--skip)}
.btn.sm{min-height:52px;font-size:1rem}
.btn:disabled{opacity:.6}
.stack{display:grid;gap:10px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}
.lab{font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:.9rem;margin-bottom:6px}
.d{color:var(--mut)}
.note{color:var(--mut);font-style:italic}
.hint{color:var(--mut);font-size:.95rem;margin-top:4px}
/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px}
.pill{min-height:62px;border:2px solid var(--line);background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1rem;cursor:pointer;padding:4px 0}
.pill i{width:12px;height:12px;border-radius:50%;background:transparent;border:2px solid var(--line);display:block}
.pill i.ok{background:var(--acc);border-color:var(--acc)}.pill i.alt{background:var(--amb);border-color:var(--amb)}.pill i.skip{background:var(--skip);border-color:var(--skip)}.pill i.miss{border-color:var(--red)}
.pill.today{border-color:var(--acc)}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pill.on i{border-color:var(--onacc)}.pill.on i.ok,.pill.on i.alt,.pill.on i.skip{background:var(--onacc)}
.back{margin:0 0 12px}
.warn{background:var(--ambbg);color:var(--amb);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-weight:600}
/* progress dots */
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.dotb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:600;padding:0}
.dot{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;background:var(--card)}
.dot.ok{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.dot.alt{background:var(--ambbg);border-color:var(--amb);color:var(--amb)}
.dot.skip{background:var(--skipbg);border-color:var(--skip);color:var(--skip)}
.dot.miss{border-color:var(--red);color:var(--red)}
.dot.sm{width:36px;height:36px;border-width:2px;font-size:1.05rem}
/* logged state */
.logged{border-radius:16px;padding:14px;margin-top:14px;border:2px solid}
.logged.ok{background:var(--accbg);border-color:var(--acc)}
.logged.alt{background:var(--ambbg);border-color:var(--amb)}
.logged.skip{background:var(--skipbg);border-color:var(--skip)}
.logged .t{font-size:1.15rem;font-weight:800;display:flex;gap:8px;align-items:center}
.logged.ok .t{color:var(--acc)}.logged.alt .t{color:var(--amb)}.logged.skip .t{color:var(--skip)}
.logged .x{margin-top:4px}
/* sheet for "Noe annet" */
.sheet{margin-top:14px;padding:14px;border:2px solid var(--amb);border-radius:16px;background:var(--ambbg)}
.sheet .q{display:block;font-weight:700;margin:0 0 6px;color:var(--ink)}
.sheet input[type=text]{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;font-size:1rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.prot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.prot .chip{min-height:56px;border-radius:16px;font-weight:700}
.bad{color:var(--red);font-weight:600;margin:6px 0}
/* uke */
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:76px;padding:10px 12px;margin:0 0 10px;border:2px solid var(--line);border-left-width:8px;border-radius:16px;background:var(--card);cursor:pointer}
.wk.ok{border-left-color:var(--acc)}.wk.alt{border-left-color:var(--amb)}.wk.skip{border-left-color:var(--skip)}.wk.miss{border-left-color:var(--red)}
.wk.today{outline:3px solid var(--acc);outline-offset:1px}
.wk .wd{width:58px;flex:none}.wk .wd b{display:block;font-size:1.2rem}.wk .wd span{color:var(--mut);font-size:.9rem}
.wk .wm{flex:1;min-width:0;overflow-wrap:anywhere}.wk .wt{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk .ws{font-size:.95rem;font-weight:600}.wk .ws.ok{color:var(--acc)}.wk .ws.alt{color:var(--amb)}.wk .ws.skip{color:var(--skip)}.wk .ws.miss{color:var(--red)}
.wk .wdots{display:flex;gap:5px;flex:none}
/* handleliste */
.bar{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.prog{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.cnt{font-weight:800;white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;margin:14px 0 6px;padding:8px 4px;background:none;border:0;border-bottom:2px solid var(--line);font-weight:800;font-size:1.1rem;cursor:pointer;text-align:left}
.gh span{color:var(--mut);font-weight:700}
.it{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 12px;margin:6px 0;background:var(--card);border:2px solid var(--line);border-radius:14px;cursor:pointer}
.it input{width:32px;height:32px;flex:none;accent-color:var(--acc);margin:0}
.it .n{font-weight:700}.it .q{color:var(--mut)}.it .tag{display:inline-block;margin-top:2px;font-size:.9rem;font-weight:700;color:var(--amb);background:var(--ambbg);border-radius:8px;padding:1px 8px}
.it.got{opacity:.5}.it.got .n{text-decoration:line-through}
.reset{margin-top:26px}
/* feedback */
.stars{display:flex;justify-content:space-between;gap:4px;margin:8px 0 14px}
.star{flex:1;min-height:64px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:2.3rem;line-height:1;color:var(--line);cursor:pointer;padding:0}
.star.on{color:var(--star);border-color:var(--star)}
.fbf label.q{display:block;font-weight:700;margin:0 0 6px}
.fbf textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;resize:vertical}
.picbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;margin:12px 0;border:2px dashed var(--mut);border-radius:16px;font-weight:700;cursor:pointer;background:var(--card)}
.picbtn input{display:none}
.pv{display:flex;align-items:center;gap:12px;margin:0 0 12px}.pv img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.ok-box{background:var(--accbg);border:2px solid var(--acc);color:var(--acc);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:800}
.fbi{padding:12px 0;border-top:1px solid var(--line)}.fbi:first-child{border-top:0}
.fbi .m{color:var(--mut);font-size:.95rem}.fbi .st{color:var(--star);font-size:1.2rem;letter-spacing:2px}
.fbi img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}
.msg{padding:30px;text-align:center;color:var(--mut)}
/* flere måltider */
.le{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 0;border-top:1px solid var(--line)}
.le:first-of-type{border-top:0}
.le .lt{width:56px;flex:none;text-align:center;font-weight:800;font-size:1.05rem}
.le .lm{flex:1;min-width:0}.le .ln{font-weight:700;overflow-wrap:anywhere}.le .ls{color:var(--mut);font-size:.95rem}
.le.skip{opacity:.65}
.lx{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.4rem;font-weight:800;cursor:pointer;color:var(--red);padding:0}
.cntb{font-weight:800;color:var(--acc);margin:0 0 10px}
.wk .wc{font-size:.95rem;font-weight:600;color:var(--mut)}
.sh.add{padding-bottom:0}
.sh.add .q2{display:block;font-weight:700;margin:14px 0 6px}
.sh.add input[type=text],.sh.add input[type=time]{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.sh.add .chips{margin:0}
.sh.add .chip{min-height:52px}
.stickb{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-top:14px}
/* chrome */
#err{position:fixed;top:72px;border-radius:12px;margin:0 12px;left:0;right:0;z-index:30;background:var(--redbg);color:var(--red);padding:10px 14px;font-weight:700;display:none}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:var(--tb);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.72rem;color:var(--mut);border-top:4px solid transparent;cursor:pointer;padding:0}
.tab b{font-size:1.6rem;line-height:1.1}
.tab.on{color:var(--acc);border-top-color:var(--acc);background:var(--accbg)}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:45;display:none;max-width:616px;margin:0 auto}
#toast .ts{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 18px;font-weight:800;font-size:1.1rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast{pointer-events:none}#toast button{pointer-events:auto;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh .top .btn{width:auto;min-width:56px;min-height:56px;flex:none}

/* v5: plan, retter, handleliste */
.row{display:flex;gap:10px;align-items:center}
.wkn{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center;margin:0 0 12px}
.wkn .btn{min-height:60px;padding:0;font-size:1.4rem}
.wkn .c{text-align:center}.wkn .c b{display:block;font-size:1.25rem}.wkn .c span{color:var(--mut);font-size:.95rem}
.pday{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:0 0 12px}
.pday.today{border-color:var(--acc)}
.pday .ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.pday .ph b{font-size:1.15rem}.pday .ph span{color:var(--mut);font-size:.95rem}
.pe{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:8px 10px;margin:6px 0;border:2px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;cursor:pointer}
.pe .ic{font-size:1.4rem;flex:none;width:32px;text-align:center}
.pe .pm{flex:1;min-width:0}.pe .pn{font-weight:700;overflow-wrap:anywhere}.pe .ps{color:var(--mut);font-size:.95rem}
.pe.ok{border-color:var(--acc)}.pe.alt{border-color:var(--amb)}.pe.skip{opacity:.6}
.addd{border-style:dashed;color:var(--acc);font-weight:700;justify-content:center;background:none}
.badge{display:inline-block;font-size:.85rem;font-weight:800;border-radius:8px;padding:1px 8px;margin-right:4px;vertical-align:1px}
.badge.liker{background:var(--accbg);color:var(--acc)}.badge.prøv{background:var(--ambbg);color:var(--amb)}.badge.fav{background:#fff2c2;color:#7a5200}
@media(prefers-color-scheme:dark){.badge.fav{background:#3d3210;color:#ffd667}}
.rc{display:block;width:100%;text-align:left;min-height:68px;padding:10px 12px;margin:0 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.rc .rn{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}.rc .rm{color:var(--mut);font-size:.95rem;margin-top:2px}
.rc.hid{opacity:.55}
.srch{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem;margin:0 0 10px}
.fl{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;margin:0 0 4px;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}
.fl .chip{flex:none}
.inp{width:100%;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem}
textarea.inp{min-height:120px;resize:vertical}
select.inp{appearance:auto}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
.ingr{border:2px solid var(--line);border-radius:14px;padding:10px;margin:0 0 8px;background:var(--card)}
.ingr .g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ingr .hh{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.ingr .hh input{width:28px;height:28px;accent-color:var(--acc)}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.step .btn{min-height:60px;font-size:1.6rem;padding:0}.step b{text-align:center;font-size:1.3rem}
.ilist{margin:6px 0 0;padding:0;list-style:none}.ilist li{padding:6px 0;border-top:1px solid var(--line)}.ilist li:first-child{border-top:0}
.ilist .h{color:var(--amb);font-weight:700;font-size:.9rem}
.steps{white-space:pre-line}
.it .rr{display:block;color:var(--mut);font-size:.9rem;margin-top:2px}
.it .ix{margin-left:auto;flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--red);font-weight:800;font-size:1.2rem}
.sum{background:var(--accbg);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-weight:600}
.lists .chip{text-align:left}
.pt{font-size:.95rem;color:var(--mut);margin-top:4px}
.tab{font-size:.78rem}
.pday .ph{align-items:center}.pday .ph>div b{margin-right:8px}
.btn.aut{width:auto;flex:none;min-width:52px;min-height:52px;padding:0;font-size:1.4rem;border-radius:14px}
.amodes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.amode{min-height:96px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:1rem}
.amode .ae{font-size:1.5rem}.amode b{font-size:1.08rem}.amode small{color:var(--mut);font-size:.9rem;line-height:1.25}
.amode.on{background:var(--accbg);border-color:var(--acc)}
.amode:first-child{grid-column:1/-1;min-height:80px}
.aopts{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 12px;margin:0 0 12px}
.aopts summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:1.05rem;cursor:pointer}
.arow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.aprev{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;margin:0 0 10px}
.aprev .ad{width:52px;text-align:center;flex:none}.aprev .ad b{display:block;font-size:1.1rem}.aprev .ad span{color:var(--mut);font-size:.9rem}
.aprev .am{flex:1;min-width:0}.aprev .an{all:unset;cursor:pointer;font-weight:700;font-size:1.08rem;min-height:48px;display:flex;align-items:center}
.aprev .as{color:var(--mut);font-size:.95rem}
.btn.abyt{flex:none;width:auto;min-height:52px;padding:0 12px;font-size:1rem}
.badge.hv{background:var(--ambbg);color:var(--amb)}
.vtog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.vtog .chip{min-height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.vtog .chip small{font-weight:600;font-size:.9rem;opacity:.85}
.chip.fastt{width:100%;min-height:56px;text-align:left;border-radius:16px;margin:0 0 12px}
.ilist.big li{font-size:18px;line-height:1.45;padding:4px 0}
.rsteps{margin:6px 0 0;padding-left:30px}
.rsteps li{font-size:19px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--line)}
.rsteps li::marker{font-weight:800;color:var(--acc)}
.rbox{margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font-size:18px;line-height:1.45}
.rbox.prep{background:var(--accbg);border-color:var(--acc)}
.rbox.tips ul{margin:4px 0 0;padding-left:20px}
.cookb{font-size:18px}
body.cooking{overflow:hidden}
#cook{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.cktop{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.cktop .btn{width:auto}
.ckw{font-size:15px;color:var(--mut)}
.ckbody{flex:1;overflow:auto;padding:8px 18px 18px}
.cklab{font-size:17px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.ckname{font-size:26px;font-weight:800;margin:4px 0}

/* ================= v7.0 – designsystem ================= */
:root{--bg:#f4f3ee;--card:#ffffff;--card2:#faf9f5;--ink:#132019;--mut:#56625b;--line:#e2e4dd;--line2:#d3d7cf;
  --acc:#17703f;--acc2:#1f9150;--onacc:#fff;--accbg:#e2f3e8;--amb:#9a5200;--ambbg:#fcefd9;--red:#b3261e;--redbg:#fde6e3;
  --skip:#4b5563;--skipbg:#eceef0;--star:#e59a00;
  --sh1:0 1px 2px rgba(19,32,25,.05),0 2px 10px rgba(19,32,25,.05);--sh2:0 2px 6px rgba(19,32,25,.06),0 12px 32px rgba(19,32,25,.10);
  --r:22px;--glass:rgba(255,255,255,.82);--tb:64px;--hdr:58px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c110e;--card:#151c18;--card2:#111713;--ink:#eef3f0;--mut:#a3afa8;--line:#25302a;--line2:#33403a;
  --acc:#4cc986;--acc2:#3bb575;--onacc:#05170d;--accbg:#163526;--amb:#f2b04a;--ambbg:#35270f;--red:#ff8d84;--redbg:#3a1a17;--skip:#b9c2bd;--skipbg:#232b27;--star:#ffb81f;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 30px rgba(0,0,0,.5);--glass:rgba(21,28,24,.82)}}
:root[data-theme=light]{color-scheme:light;--bg:#f4f3ee;--card:#ffffff;--card2:#faf9f5;--ink:#132019;--mut:#56625b;--line:#e2e4dd;--line2:#d3d7cf;
  --acc:#17703f;--acc2:#1f9150;--onacc:#fff;--accbg:#e2f3e8;--amb:#9a5200;--ambbg:#fcefd9;--red:#b3261e;--redbg:#fde6e3;--skip:#4b5563;--skipbg:#eceef0;--star:#e59a00;
  --sh1:0 1px 2px rgba(19,32,25,.05),0 2px 10px rgba(19,32,25,.05);--sh2:0 2px 6px rgba(19,32,25,.06),0 12px 32px rgba(19,32,25,.10);--glass:rgba(255,255,255,.82)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c110e;--card:#151c18;--card2:#111713;--ink:#eef3f0;--mut:#a3afa8;--line:#25302a;--line2:#33403a;
  --acc:#4cc986;--acc2:#3bb575;--onacc:#05170d;--accbg:#163526;--amb:#f2b04a;--ambbg:#35270f;--red:#ff8d84;--redbg:#3a1a17;--skip:#b9c2bd;--skipbg:#232b27;--star:#ffb81f;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 30px rgba(0,0,0,.5);--glass:rgba(21,28,24,.82)}
html{font-size:17px}
body{font-family:var(--font);letter-spacing:-.005em;padding-bottom:calc(var(--tb) + env(safe-area-inset-bottom) + 110px);-webkit-font-smoothing:antialiased}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.025em;margin:6px 0 4px}
h2{font-size:1.25rem;font-weight:800;letter-spacing:-.015em}
main{padding:10px 16px 0}
.offpage{font-size:16px}
.sub,.offsum{color:var(--mut);font-weight:500}
.offsum{font-weight:600}
.lab{font-size:.78rem;letter-spacing:.07em;font-weight:800}

/* kort og knapper */
.card,.pday,.hres,.offc,.hgrp,.aprev,.aopts,.ingr,.offst,.krow,.fyllbox{border:1px solid var(--line);box-shadow:var(--sh1);border-radius:var(--r)}
.card{padding:18px}
.btn{border:1.5px solid var(--line2);border-radius:16px;box-shadow:var(--sh1);transition:transform .12s,box-shadow .15s,background .15s;font-weight:700}
.btn:hover{box-shadow:var(--sh2)}
.btn.go{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.sm{min-height:50px}
.chip{border:1.5px solid var(--line2);border-radius:999px;font-weight:700;transition:background .15s,border-color .15s}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.srch,.inp,.sheet input[type=text],.sh.add input[type=text],.sh.add input[type=time],.fbf textarea{border:1.5px solid var(--line2);border-radius:16px;background:var(--card)}
.srch:focus,.inp:focus,input:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:1px;border-color:var(--acc)}
.pill{border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh1)}
.pill.on{background:linear-gradient(160deg,var(--acc),var(--acc2));border-color:transparent}
.gday{border:1px solid var(--line);box-shadow:var(--sh1);border-radius:18px}
.pe{border:1.5px solid var(--line);background:var(--card2);border-radius:16px}
.pe.ok{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.badge{border-radius:999px;padding:2px 9px;font-size:.78rem}
.sum{border-radius:16px}
.logged{border-width:1.5px;border-radius:18px}
.warn{border-radius:14px}
.it{border:1.5px solid var(--line);box-shadow:var(--sh1);border-radius:16px;transition:opacity .2s,transform .15s}
.it:active{transform:scale(.99)}
.it input{width:28px;height:28px}
.gh{border-bottom:1px solid var(--line2);font-size:1rem}
.prog{height:12px;background:var(--line)}.prog i{background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.offtile{border:1px solid var(--line);box-shadow:var(--sh1);border-radius:20px;min-height:74px;padding:12px 14px;transition:transform .12s,box-shadow .15s}
.offtile:hover{box-shadow:var(--sh2)}
.otico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:var(--accbg);flex:none}
.offtile:nth-child(6n+2) .otico{background:var(--ambbg)}
.offtile:nth-child(6n+3) .otico{background:#e5edfb}
.offtile:nth-child(6n+4) .otico{background:#fbe7ec}
.offtile:nth-child(6n+5) .otico{background:#efe8fb}
.offtile:nth-child(6n) .otico{background:#e3f4f4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .offtile:nth-child(n) .otico{background:color-mix(in srgb,var(--acc) 16%,var(--card))}}
:root[data-theme=dark] .offtile:nth-child(n) .otico{background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.offtile::after{content:"›";margin-left:auto;font-size:1.6rem;color:var(--mut);font-weight:400}
.ottxt span{font-weight:500}
.offhub{gap:10px}
@media(min-width:620px){.offhub{display:grid;grid-template-columns:1fr 1fr}}
.offback{border-radius:999px;min-height:46px}

/* app-bar */
#appbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(14px,calc((100% - 680px)/2 + 16px)) 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
#appbar.sc{border-bottom-color:var(--line)}
#appbar .brand{display:flex;align-items:center;gap:9px;text-align:left;line-height:1.1;font-weight:800;font-size:1.08rem;letter-spacing:-.02em;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
#appbar .brand i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc),#3dbb73);color:#fff;font-style:normal;font-size:1rem;box-shadow:0 4px 12px -4px var(--acc)}
#appbar .brand small{font-weight:600;color:var(--mut);font-size:.8rem}
#appbar .sp{flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh1);padding:0}
.ib svg{width:21px;height:21px}
.ib{flex:none}#cmdq::-webkit-search-cancel-button{display:none}#cmdk .bar>svg{width:22px;height:22px;margin-left:8px;color:var(--mut);flex:none}
main{max-width:680px}

/* bunnmeny */
.tb{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:1px solid var(--line);border-radius:26px;background:var(--glass);
  backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);box-shadow:var(--sh2);max-width:660px;margin:0 auto;gap:2px}
.tab{min-height:56px;border:0!important;border-radius:20px;font-size:.68rem;font-weight:700;gap:3px;color:var(--mut);transition:background .2s,color .2s}
.tab svg{width:23px;height:23px;transition:transform .2s}
.tab.on{background:var(--accbg);color:var(--acc)}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab b{display:none}

/* overgang */
@keyframes v7in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v7up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes v7fade{from{opacity:0}to{opacity:1}}
@keyframes v7pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
#view.enter>*{animation:v7in .28s cubic-bezier(.2,.7,.2,1) both}
#modal.enter .ov{animation:v7fade .2s both}#modal.enter .sh{animation:v7up .3s cubic-bezier(.2,.8,.2,1) both}
.ov{background:rgba(8,14,10,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sh{border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding-top:10px}
.sh::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
.sh .top .btn{border-radius:999px;min-width:48px;min-height:48px}
#toast .ts{border-radius:20px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);animation:v7pop .22s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* skjelett */
.skel{display:grid;gap:12px;padding-top:6px}
.skel i{display:block;border-radius:20px;background:linear-gradient(90deg,var(--line) 0%,var(--card) 50%,var(--line) 100%);background-size:200% 100%;animation:v7sk 1.2s linear infinite}
@keyframes v7sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* matkunst */
.art{flex:none;display:grid;place-items:center;border-radius:18px;position:relative;overflow:hidden;background:var(--a1);isolation:isolate}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.65),transparent 55%),linear-gradient(140deg,var(--a1),var(--a2));z-index:-1}
.art span{filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));line-height:1}

:root[data-theme=dark] .art::before{background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.14),transparent 55%),linear-gradient(140deg,var(--a1),var(--a2));opacity:.38}

.mp{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* karusell */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -16px 6px;padding:4px 16px 12px;scrollbar-width:none}

/* I dag – hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;margin:4px 0 14px;color:#fff;background:linear-gradient(140deg,#135f36 0%,#1d8a4b 55%,#2fae67 100%);box-shadow:0 14px 34px -14px rgba(23,112,63,.6)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}

.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;position:relative;z-index:1}
.ring{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:10px 12px}
.ring .rg{position:relative;width:58px;height:58px;flex:none}.ring svg{width:58px;height:58px;transform:rotate(-90deg)}.ring .rg i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.8rem}

.mcard{padding:0;overflow:hidden}

.tl{position:relative;margin:6px 0 0;padding-left:18px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .le{border-top:0;position:relative}
.tl .le::before{content:"";position:absolute;left:-17px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--card);border:3px solid var(--acc)}
.tl .le.skip::before{border-color:var(--skip)}

.wkg .gd .gm{flex:1;min-width:0}.wkg .gd .gm b{display:block;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wkg .gd .gm small{color:var(--mut);font-weight:600}

.dotst{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line2)}.dotst.ok{background:var(--acc)}.dotst.alt{background:var(--amb)}.dotst.skip{background:var(--skip)}

/* oppskrift-modal */
.rhero{margin:0 0 12px}

.portb{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px;margin:10px 0}
.portb b{font-size:1rem}.portb .pc{display:flex;align-items:center;gap:8px}.portb .pc span{min-width:2.2em;text-align:center;font-weight:800;font-size:1.15rem}
.portb .ib{width:44px;height:44px;font-size:1.3rem;font-weight:800}
.ilist7{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ilist7 li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:1rem;line-height:1.3;transition:opacity .2s}
.ilist7 li .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:.9rem;color:var(--onacc)}

.ilist7 li .h{font-size:.74rem;font-weight:700;color:var(--amb);display:block}
.rsteps7{list-style:none;counter-reset:s;margin:6px 0 0;padding:0}

.tchip:active{transform:scale(.96)}
.tchip.run{background:var(--acc);color:var(--onacc)}

/* timere */

body.cooking #timers{bottom:calc(96px + env(safe-area-inset-bottom));z-index:210}

/* kokemodus */
#cook{background:var(--bg)}
.ckdots{display:flex;gap:5px;margin:6px 0 16px}.ckdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.ckdots i.on{background:var(--acc)}

/* statistikk */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 14px}

.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:700;padding:6px 9px;border-radius:10px;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .12s}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}

details.tbl summary{cursor:pointer;color:var(--acc);font-weight:800;min-height:40px;display:flex;align-items:center}

/* søk */
#cmdk{position:fixed;inset:0;z-index:150;background:rgba(8,14,10,.45);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;animation:v7fade .15s both}

kbd{font:inherit;font-size:.75rem;font-weight:700;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--mut)}

<body>
<div id="err"></div>
<main id="view"><div class="msg">Laster …</div></main>
<div id="toast"></div>
<div id="modal"></div>
<nav class="tb">
  <button class="tab on" data-t="idag"><b>🏠</b>I dag</button>
  <button class="tab" data-t="plan"><b>📅</b>Plan</button>
  <button class="tab" data-t="handle"><b>🛒</b>Handle</button>
  <button class="tab" data-t="retter"><b>📖</b>Retter</button>
  <button class="tab" data-t="tilbud"><b>🏷️</b>Tilbud</button>
  <button class="tab" data-t="fb"><b>💬</b>Feedback</button>
</nav>
<script>
const URL_ = "https://yhzgdipjpdmovegbkybx.supabase.co", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloemdkaXBqcGRtb3ZlZ2JreWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY5NzcsImV4cCI6MjEwNTkxMjk3N30.13nVIkVWVIb-fh7oPKA1tHdCeX8tKqIpVi_o80rXIo4";
const H = {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json"};
const TABS = ["idag", "plan", "handle", "retter", "tilbud", "fb"];
const DK = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const DL = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const SLOTS = [["frokost","Frokost","🥣"],["lunsj","Lunsj","🥪"],["middag","Middag","🍽️"],["snack","Mellommåltid","🍌"],["kvelds","Kvelds","🌙"]];
const SL = Object.fromEntries(SLOTS.map(s => [s[0], s[1]])), SI = Object.fromEntries(SLOTS.map(s => [s[0], s[2]]));
const SORD = SLOTS.map(s => s[0]);
const KINDS = [["middag","Middag"],["frokost","Frokost"],["lunsj","Lunsj"],["snack","Snack"]];
const KL = Object.fromEntries(KINDS);
const EQ = [["airfryer","Airfryer"],["riskoker","Riskoker"],["wok","Wok"],["ovn","Ovn"],["stekepanne","Stekepanne"],["kjele","Kjele"],["mikro","Mikro"]];
const EQL = Object.fromEntries(EQ);
const CATS = ["Kjøtt, fisk og egg","Meieri","Grønnsaker og frukt","Brød","Tørrvarer","Frys","Hermetikk og glass","Krydder, saus og olje","Annet"];
const UNITS = ["g","kg","stk","dl","l","ml","ss","ts","pk","boks","glass","pose","beger","skive","fl"];
const GOAL = {kcal: [2100, 2300], prot: [130, 150]};

let recipes = [], plan = [], entries = [], fb = [], lists = [], items = [], offers = [], favs = [];
let tab = "idag", sel = ds(new Date()), viewMon = monday(ds(new Date())), curList = null, M = null, loaded = false;
const NAV = {idag: null, plan: null, handle: null, retter: null, haveRes: false, fb: null, planDay: null};
let hubNav = 0;
const drafts = {}, logDraft = {}, logOpen = new Set(), catOpen = {}, showRec = new Set();
let RF = {q: "", tag: "", kind: "", time: 0, eq: ""};
let shopF = {from: ds(new Date()), days: 7, to: null, preview: null, busy: false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const err = m => { const e = $("#err"); e.textContent = m || ""; e.style.display = m ? "block" : "none"; if (m) setTimeout(() => err(), 6000); };
const R = id => recipes.find(r => r.id === id);
const hurtigOf = r => r && recipes.find(x => x.variant === "hurtig" && x.variant_of === r.id);
const baseId = id => { const r = R(id); return r && r.variant === "hurtig" && r.variant_of ? r.variant_of : id; };

/* ---------- datoer ---------- */
function ds(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function add(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function monday(s) { const d = pd(s); return add(s, -((d.getDay() + 6) % 7)); }
const today = () => ds(new Date());
const wd = s => (pd(s).getDay() + 6) % 7;
const fmt = (s, o) => pd(s).toLocaleDateString("nb-NO", o || {day: "numeric", month: "short"});
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
function isoWeek(s) { const d = pd(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const y = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - y) / 864e5 - 3 + (y.getDay() + 6) % 7) / 7); }
const relDay = s => { const n = diffDays(today(), s); return n === 0 ? "I dag" : n === -1 ? "I går" : n === 1 ? "I morgen" : ""; };
const num = q => q == null ? "" : String(+(+q).toFixed(2)).replace(".", ",");
const qtyTxt = (q, u) => q == null ? "" : num(q) + (u ? " " + u : "");

/* ---------- data ---------- */
async function api(path, opts) {
  const r = await fetch(URL_ + "/rest/v1/" + path, {headers: H, ...opts});
  if (!r.ok) throw new Error(r.status + " " + await r.text());
  return r.status === 204 ? null : r.json();
}
const rpc = (n, b) => api("rpc/" + n, {method: "POST", body: JSON.stringify(b || {})});
let writeSeq = 0, pending = 0, lastSig = "";
async function fetchPlan() {
  const tm = monday(today()), sm = monday(sel);
  const ws = [...new Set([tm, viewMon, sm])];
  const all = (await Promise.all(ws.map(w => rpc("plan_list", {p_from: w, p_to: add(w, 6)})))).flat(), seen = new Set();
  return all.filter(x => !seen.has(x.id) && seen.add(x.id));
}
async function load() {
  const seq = writeSeq;
  try {
    const sm = monday(sel);
    const res = await Promise.all([rpc("recipes_list"), fetchPlan(), rpc("list_entries", {p_from: sm, p_to: add(sm, 6)}),
      rpc("list_feedback_recent", {p_limit: 100}).catch(() => fb), rpc("shop_lists").catch(() => lists),
      rpc("offers_list").catch(() => offers || []), rpc("fav_list").catch(() => favs || [])]);
    const ls = res[4];
    let cl = curList;
    if (cl == null || !ls.some(l => l.id === cl)) cl = ls[0] ? ls[0].id : null;
    const it = cl ? await rpc("shop_items", {p_list: cl}) : [];
    if (loaded && (pending > 0 || seq !== writeSeq)) return;
    const sig = JSON.stringify([res, it]), same = sig === lastSig; lastSig = sig;
    [recipes, plan, entries, fb, lists] = res; offers = Array.isArray(res[5]) ? res[5] : []; favs = Array.isArray(res[6]) ? res[6] : []; items = it; curList = cl; loaded = true;
    err();
    if (same && $("#view").children.length && !$("#view .msg.loading")) return;
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches("textarea, input[type=text], input[type=search], input[type=number], input[type=date]")) return;
    render();
  } catch (e) { err("Kunne ikke hente data. Prøv å laste siden på nytt."); console.error(e); }
}
async function refreshPlan() { try { plan = await fetchPlan(); } catch (e) { console.error(e); } }
async function write(fn, failMsg) {
  writeSeq++; pending++;
  try { const r = await fn(); err(); return r; }
  catch (e) { console.error(e); err(failMsg || "Kunne ikke lagre! Sjekk nettforbindelsen og prøv igjen."); throw e; }
  finally { pending--; writeSeq++; lastSig = ""; }
}

/* ---------- toast ---------- */
let toastTimer = null, toastUndo = null;
function showToast(msg, undo) {
  toastUndo = undo || null;
  $("#toast").innerHTML = `<div class="ts"><span>${esc(msg)}</span>${undo ? `<button data-toastundo>↩ Angre</button>` : ""}</div>`;
  $("#toast").style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").style.display = "none"; toastUndo = null; }, 6000);
}

/* ---------- plan-handlinger ---------- */
async function planAdd(date, slot, rid, portions, quiet) {
  const r = R(rid);
  let id;
  try { id = await write(() => rpc("plan_add", {p_date: date, p_slot: slot, p_recipe: rid, p_portions: portions || null}), "Kunne ikke legge til. Prøv igjen."); } catch (_) { render(); return null; }
  await refreshPlan();
  if (!quiet) showToast("✓ " + (r ? r.name : "Lagt til") + " – " + DK[wd(date)] + " " + fmt(date), () => planRemove(id, true));
  render(); return id;
}
async function planRemove(id, isUndo) {
  const e0 = plan.find(x => x.id === id); if (!e0) return;
  const lo = leftOf(e0), prev = plan; plan = plan.filter(x => x.id !== id && x.leftover_of !== id); render();
  try { await write(() => rpc("plan_remove", {p_id: id}), "Kunne ikke fjerne. Prøv igjen."); }
  catch (_) { plan = prev; render(); return; }
  if (isUndo) showToast("Angret");
  else showToast(lo ? "Fjernet – restene " + DK[wd(lo.date)] + " også" : "Fjernet fra planen", async () => {
    if (e0.leftover_of) { await relink(e0.leftover_of, e0); await refreshPlan(); render(); return showToast("Lagt tilbake"); }
    const nid = await planAdd(e0.date, e0.slot, e0.recipe_id, e0.portions, true); if (nid && lo) { await relink(nid, lo); await refreshPlan(); render(); } showToast("Lagt tilbake"); });
}
async function planUpdate(id, ch) {
  const e0 = plan.find(x => x.id === id); if (!e0) return;
  const old = {date: e0.date, slot: e0.slot, portions: e0.portions};
  Object.assign(e0, ch); render();
  try { await write(() => rpc("plan_update", {p_id: id, p_date: ch.date || null, p_slot: ch.slot || null, p_portions: ch.portions || null})); }
  catch (_) { Object.assign(e0, old); render(); }
}
function planOf(date) { return plan.filter(p => p.date === date).sort((a, b) => SORD.indexOf(a.slot) - SORD.indexOf(b.slot) || a.id - b.id); }

/* ---------- logging (plan-rader) ---------- */
const SC = {som_planlagt: "ok", endret: "alt", hoppet_over: "skip"};
const PROT = {lite: "Lite protein", greit: "Greit", mye: "Mye protein"};
const FILL = ["Pizza", "Rester", "Kylling og ris", "Takeaway"];
const pe = k => plan.find(p => p.id === +k.split(":")[1]);
async function saveLog(k, st, text, protein, quiet) {
  const r = pe(k); if (!r) return;
  const prev = {status: r.status ?? null, actual_text: r.actual_text ?? null, actual_protein: r.actual_protein ?? null};
  Object.assign(r, {status: st, actual_text: text, actual_protein: protein});
  logOpen.delete(k); render();
  if (!quiet) showToast(st ? "✓ Lagret" : "Angret", st ? () => saveLog(k, prev.status, prev.actual_text, prev.actual_protein, true) : null);
  else showToast("Angret");
  try { await write(() => rpc("plan_log", {p_id: r.id, p_status: st, p_actual: text, p_protein: protein})); }
  catch (_) { Object.assign(r, prev); $("#toast").style.display = "none"; render(); }
}
function statusText(r) {
  if (r.status === "som_planlagt") return "Spist som planlagt";
  if (r.status === "endret") return "Spist: " + (r.actual_text || "noe annet");
  if (r.status === "hoppet_over") return "Hoppet over";
  return "";
}
function loggedBox(k) {
  const r = pe(k), c = SC[r.status];
  return `<div class="logged ${c}"><div class="t"><span>${r.status === "hoppet_over" ? "–" : "✓"}</span><span>Lagret</span></div>
    <div class="x"><b>${esc(statusText(r))}</b>${r.actual_protein ? " · " + PROT[r.actual_protein] : ""}</div>
    <div class="grid2"><button class="btn sm" data-other data-lk="${k}">✎ Endre</button><button class="btn sm" data-set="" data-lk="${k}">↩ Angre</button></div></div>`;
}
function logSheet(k) {
  const d = logDraft[k] || (logDraft[k] = {text: "", protein: null, bad: ""}), id = "lt-" + k.replace(":", "");
  return `<div class="sheet" data-lk="${k}"><label class="q" for="${id}">Hva spiste du?</label>
    <input type="text" id="${id}" class="lgi" maxlength="200" enterkeyhint="done" placeholder="F.eks. pizza" value="${esc(d.text)}">
    <div class="chips">${FILL.map(f => `<button class="chip" data-fill="${esc(f)}">${esc(f)}</button>`).join("")}</div>
    <label class="q" style="margin-top:10px">Hvor mye protein? <span class="d">(valgfritt)</span></label>
    <div class="prot">${Object.keys(PROT).map(p => `<button class="chip ${d.protein === p ? "on" : ""}" data-prot="${p}">${PROT[p]}</button>`).join("")}</div>
    ${d.bad ? `<div class="bad">${esc(d.bad)}</div>` : ""}
    <div class="stack" style="margin-top:0"><button class="btn go" data-logsave>Lagre</button><button class="btn sm" data-cancel data-lk="${k}">Avbryt</button></div></div>`;
}
function logButtons(k) {
  const r = pe(k);
  if (logOpen.has(k)) return logSheet(k);
  if (r.status) return loggedBox(k);
  return `<div class="stack"><button class="btn go" data-set="som_planlagt" data-lk="${k}">✓ Spist som planlagt</button>
    <div class="grid2" style="margin-top:0"><button class="btn alt" data-other data-lk="${k}">Noe annet</button>
    <button class="btn skip" data-set="hoppet_over" data-lk="${k}">Hoppet over</button></div></div>`;
}

/* ---------- Annet i dag (frie oppføringer) ---------- */
const TYPES = [["frokost","Frokost"],["lunsj","Lunsj"],["mellommåltid","Mellommåltid"],["snack","Snack"],["kvelds","Kvelds"],["drikke","Drikke/shake"],["annet","Annet"]];
const TL = Object.fromEntries(TYPES);
const TICON = {frokost: "🥣", lunsj: "🥪", "mellommåltid": "🍎", snack: "🍌", kvelds: "🌙", drikke: "🥤", annet: "🍴"};
const TTIME = {frokost: "08:00", lunsj: "12:00", "mellommåltid": "15:00", snack: "16:30", kvelds: "21:00", drikke: "15:00", annet: "12:00"};
const STIME = {frokost: 480, lunsj: 720, middag: 1110, snack: 930, kvelds: 1260};
const QUICK = ["Proteinshake","Proteinbar","Skyr","Nøtter","Banan","Eple","Riskrem","Brødskive","Egg","Havregrøt"];
const QTYPE = {Proteinshake: "drikke", Proteinbar: "snack", "Nøtter": "snack", Riskrem: "kvelds", Banan: "snack", Eple: "snack"};
const hhmm = (d = new Date()) => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const typeByTime = t => { const h = +t.slice(0, 2); return h < 10 ? "frokost" : h < 14 ? "lunsj" : h < 18 ? "mellommåltid" : "kvelds"; };
function dayItems(d) {
  const a = [];
  for (const p of planOf(d).filter(p => p.status)) {
    const r = R(p.recipe_id) || {name: "?"}, skip = p.status === "hoppet_over";
    a.push({k: "p:" + p.id, min: STIME[p.slot], icon: SI[p.slot], skip, name: skip ? "Hoppet over: " + r.name : p.status === "endret" ? (p.actual_text || "Noe annet") : r.name,
      sub: SL[p.slot] + (p.status === "som_planlagt" ? " · som planlagt" : "") + (p.actual_protein && !skip ? " · " + PROT[p.actual_protein] : "")});
  }
  for (const e of entries.filter(x => x.date === d)) a.push({eid: e.id, min: toMin(e.eaten_time), time: e.eaten_time, icon: TICON[e.entry_type], name: e.label, sub: TL[e.entry_type] + (e.protein ? " · " + PROT[e.protein] : "")});
  return a.sort((x, y) => x.min - y.min);
}
const cntTxt = n => n + (n === 1 ? " måltid" : " måltider");
const typeOf = x => x.type || QTYPE[x.preset] || typeByTime(x.time || (sel === today() ? x.now : "15:00"));
const effTime = x => x.time || (sel === today() ? x.now : TTIME[x.type || QTYPE[x.preset] || "mellommåltid"]);
function openAdd() { M = {t: "add", x: {type: null, preset: null, text: "", protein: null, time: null, now: hhmm(), bad: "", busy: false}}; render(); }
function addSheetHtml(x) {
  const t = effTime(x), ty = typeOf(x);
  return `<div class="top"><div><div class="lab">Legg til måltid</div><h2>${DL[wd(sel)]} ${esc(fmt(sel))}</h2></div><button class="btn" data-close aria-label="Lukk">✕</button></div>
    <label class="q2" style="margin-top:0">Hva spiste du?</label>
    <div class="chips">${QUICK.concat("Annet").map(p => `<button class="chip ${x.preset === p ? "on" : ""}" data-apre="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <label class="q2" for="at-text">${x.preset === "Annet" || !x.preset ? "Skriv kort" : "Tillegg"} <span class="d">${x.preset && x.preset !== "Annet" ? "(valgfritt)" : ""}</span></label>
    <input type="text" id="at-text" maxlength="100" enterkeyhint="done" placeholder="F.eks. yoghurt med müsli" value="${esc(x.text)}">

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function resize(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.8);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Kunne ikke lese bildet")); };
    im.src = u;
  });
}
async function send(k) {
  const x = dr(k); if (x.busy) return;
  const comment = x.comment.trim();
  if (!comment && !x.rating && !x.file) { x.bad = "Gi stjerner, skriv noe eller legg ved et bilde."; x.ok = false; return render(); }
  let rid = null, pid = null;
  if (k[0] === "p") { const p = pe(k); pid = p ? p.id : null; rid = p ? p.recipe_id : null; }
  if (k[0] === "r") rid = +k.slice(2);
  x.busy = true; x.bad = ""; x.ok = false; render();
  try {
    await write(async () => {
      let path = null;
      if (x.file) {
        const blob = await resize(x.file); path = "feedback/" + uid() + ".jpg";
        const r = await fetch(URL_ + "/storage/v1/object/mat-app/" + path, {method: "POST", headers: {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "image/jpeg"}, body: blob});
        if (!r.ok) throw new Error("Opplasting av bilde feilet");
      }
      await rpc("add_feedback2", {p_recipe_id: rid, p_plan_entry_id: pid, p_rating: x.rating || null, p_comment: comment, p_photo_path: path});
    }, "Kunne ikke sende. Sjekk nettforbindelsen og prøv igjen.");
    if (x.url) URL.revokeObjectURL(x.url);
    drafts[k] = {rating: 0, comment: "", file: null, url: null, busy: false, ok: true, bad: ""};
    fb = await rpc("list_feedback_recent", {p_limit: 100}).catch(() => fb);
  } catch (e) { x.busy = false; x.bad = "Kunne ikke sende. Sjekk nettforbindelsen og prøv igjen."; }
  render();
}

async function saveRecipe() {
  const x = M.x; if (x.busy) return;
  if (!String(x.name).trim()) { x.bad = "Gi retten et navn."; return render(); }
  const ing = x.ing.filter(i => String(i.name).trim()).map(i => ({...i, qty: String(i.qty ?? "").replace(",", ".").trim()}));
  if (ing.some(i => i.qty && isNaN(+i.qty))) { x.bad = "Mengde må være et tall (f.eks. 400 eller 0,5)."; return render(); }
  x.busy = true; x.bad = ""; render();
  try {
    const id = await write(() => rpc("recipe_save", {p: {...x, name: String(x.name).trim(), ing}}), "Kunne ikke lagre retten.");
    recipes = await rpc("recipes_list");
    showToast(x.id ? "✓ Retten er oppdatert" : "✓ Ny rett lagret");
    M = {t: "recipe", id};
  } catch (e) { x.busy = false; x.bad = "Kunne ikke lagre: " + ((String(e.message).match(/"message":"([^"]+)"/) || [])[1] || "sjekk feltene"); }
  render();
}
function renderModal() {
  const el = $("#modal"), old = el.querySelector(".sh"), top = old ? old.scrollTop : 0, oldT = el.dataset.k || "";

  if (M && M.t === "have") { M = null; }
  if (M && M.t === "auto" && typeof NAV !== "undefined" && NAV.plan === "auto") {
    el.innerHTML = ""; el.dataset.k = ""; document.body.classList.remove("nos"); return;
  }
  if (M && M.t === "haveui") {
    el.innerHTML = ""; el.dataset.k = ""; document.body.classList.remove("nos"); return;
  }
  if (M) {
    if (M.t === "pick") inner = pickHtml(M);
    else if (M.t === "entry") inner = entryHtml(M);
    else if (M.t === "recipe") inner = recHtml(M);
    else if (M.t === "edit") inner = editHtml(M);

    else if (M.t === "auto") inner = autoHtml(M);

  const key = M.t + ":" + (M.id || M.date || M.k || "");

  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.t === tab));
  if (!loaded) { renderModal(); return; }
  const f = {idag: viewIdag, plan: viewPlan, handle: viewHandle, retter: viewRetter, tilbud: viewTilbud, fb: viewFb}[tab];
  const ae = document.activeElement, fid = ae && ae.id && $("#view").contains(ae) ? ae.id : null, ss = fid ? ae.selectionStart : null;

  if (fid) { const n = document.getElementById(fid); if (n) { n.focus({preventScroll: true}); try { n.setSelectionRange(ss, ss); } catch (_) {} } }
  renderModal();
}
function go(t) {

  const t = ev.target, c = s => t.closest(s);

  if ((e = c(".tab"))) return go(e.dataset.t);
  if (c("[data-toastundo]")) { const u = toastUndo; $("#toast").style.display = "none"; if (u) u(); return; }
  if (c("[data-close]") || t.matches("[data-ov]")) { M = null; return render(); }
  if (c("[data-mback]")) { M = M.back; return render(); }
  if (M && M.t === "add") {
    const x = M.x;
    if ((e = c("[data-apre]"))) { const p = e.dataset.apre; x.preset = x.preset === p ? null : p; x.bad = ""; render(); if (x.preset === "Annet") { const i = $("#at-text"); if (i) i.focus({preventScroll: true}); } return; }
    if ((e = c("[data-atype]"))) { x.type = e.dataset.atype; return render(); }
    if ((e = c("[data-aprot]"))) { x.protein = x.protein === e.dataset.aprot ? null : e.dataset.aprot; return render(); }
    if (c("[data-asave]")) return addEntry();

function cheapHealthy() {
  const out = [];
  for (const r of recipes) {
    if (r.hidden || r.kind !== "middag" || r.variant === "hurtig") continue;
    if (/grandiosa|pizza|ferdig/i.test(r.name)) continue;
    const c = recipeOfferCost(r);
    if (!c.protOn || c.used < 1) continue;
    out.push({r, c});
  }
  out.sort((a, b) => a.c.kr - b.c.kr || (b.r.protein || 0) - (a.r.protein || 0));
  return out;
}
function readyRecipeHint(o) {

  return "";
}


function slotsFromShop() {
  const names = (items || []).filter(i => !i.checked).map(i => i.name);
  const map = new Map();
  for (const name of names) {
    const hits = offersForItem(name);
    const k = (hits[0] && (offerKey(hits[0]) || offText(hits[0]).slice(0, 40))) || normIng(name) || name.toLowerCase();
    if (!map.has(k)) map.set(k, {key: k, label: name, offers: [], hasOffer: false});
    const slot = map.get(k);
    if (hits.length) { slot.hasOffer = true; slot.offers = slot.offers.concat(hits); }
  }
  return {names, slots: [...map.values()]};
}

    const best = Object.values(by).sort((a, b) => a.price - b.price)[0];

  }

/* ---------- App-hubber (v6.0) – samme mønster som Tilbud ---------- */
const HUB_VIEWS = {
  idag: [null, "mer"],
  plan: [null, "uke", "auto", "dato", "rester", "historikk"],
  handle: [null, "liste", "ny", "tidligere"],
  retter: [null, "have", "sok", "favs", "nytt", "raske", "protein", "smak", "ny"],
  fb: [null, "historikk"]
};

function hubHash() {
  if (tab === "tilbud" && typeof tilbudHash === "function") return tilbudHash();
  const v = NAV[tab];
  if (tab === "retter" && v === "have" && NAV.haveRes) return "#retter/have/resultat";
  if (!v) return "#" + tab;
  return "#" + tab + "/" + v;
}
function applyHubHash() {
  const raw = (location.hash || "").slice(1);
  const parts = raw.split("/").filter(Boolean);
  const t0 = parts[0];
  if (t0 === "tilbud") {
    if (typeof applyOffHash === "function") applyOffHash();
    return;
  }
  if (TABS.includes(t0)) tab = t0;
  NAV.haveRes = false;
  if (!t0 || !HUB_VIEWS[tab]) return;
  let v = parts[1] || null;
  if (tab === "retter" && v === "have" && parts[2] === "resultat") { NAV.retter = "have"; NAV.haveRes = true; return; }
  const allow = HUB_VIEWS[tab];
  NAV[tab] = allow.includes(v) ? v : null;
}
function go(t, view) {
  tab = t;
  Object.keys(HUB_VIEWS).forEach(k => { if (k !== t) { /* keep other tab views */ } });
  if (HUB_VIEWS[t]) NAV[t] = view || null;
  if (t === "retter" && view !== "have") NAV.haveRes = false;
  if (t === "tilbud" && typeof OF !== "undefined" && !view) { OF.view = null; OF.store = null; }
  const hash = (t === "tilbud" && !view && typeof tilbudHash === "function") ? "#tilbud" : (view ? "#" + t + "/" + view : "#" + t);
  history.replaceState({tab: t, view: view || null}, "", hash);
  render();
  scrollTo(0, 0);
}
function goHub(view, extra) {
  if (typeof view === "string" && view.includes("/")) {
    const [t, v, more] = view.split("/");
    if (t === "tilbud") {
      tab = "tilbud";
      if (typeof goOff === "function") { goOff(v, more || null); return; }
    }
    tab = t;
    view = v;
    if (t === "retter" && v === "have" && more === "resultat") NAV.haveRes = true;
  }
  if (tab === "tilbud" && typeof goOff === "function") { goOff(view, extra); return; }
  if (view === "auto") return openAuto(extra || null);
  if (view === "ny" && tab === "retter") { NAV.retter = "ny"; openEdit(null); return; }
  NAV[tab] = view || null;
  if (!(tab === "retter" && view === "have" && NAV.haveRes)) {
    if (tab === "retter" && view !== "have") NAV.haveRes = false;
  }
  hubNav++;
  history.pushState({tab, view: NAV[tab], haveRes: NAV.haveRes}, "", hubHash());
  render();
  scrollTo(0, 0);
}
function hubBack() {
  if (hubNav > 0 || offNav > 0) { history.back(); return; }
  NAV[tab] = null;
  NAV.haveRes = false;
  if (tab === "plan" && M && M.t === "auto") M = null;
  history.replaceState({tab, view: null}, "", "#" + tab);
  render();
  scrollTo(0, 0);
}
