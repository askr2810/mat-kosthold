<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17703f">
<title>Mat – plan og handleliste</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#0f1512;--mut:#47515a;--line:#cfd6d1;--acc:#17703f;--onacc:#fff;--accbg:#dcf2e5;--amb:#9a5200;--ambbg:#fdebd0;--red:#b3261e;--redbg:#fde3e1;--skip:#4b5563;--skipbg:#e5e8eb;--star:#e59a00;--tb:68px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f0d;--card:#161c19;--ink:#f4f7f5;--mut:#aab5af;--line:#2f3a35;--acc:#4cc986;--onacc:#05170d;--accbg:#173a28;--amb:#f2b04a;--ambbg:#3a2a10;--red:#ff8d84;--redbg:#3d1b18;--skip:#b9c2bd;--skipbg:#262e2a;--star:#ffb81f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--tb) + env(safe-area-inset-bottom) + 90px)}
body.nos{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
h1{font-size:1.5rem;line-height:1.15;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
h2{font-size:1.3rem;line-height:1.2;margin:0 0 4px}
button{font:inherit;color:inherit}
.sheet{scroll-margin-top:12px}
.btn,.sheet,.card,input,textarea,.it,.wk,.star,.picbtn{scroll-margin-bottom:calc(var(--tb) + 110px)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1.08rem;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--onacc);min-height:64px;font-size:1.2rem}
.btn.alt{border-color:var(--amb);color:var(--amb)}
.btn.skip{color:var(--skip)}
.btn.sm{min-height:52px;font-size:1rem}
.btn:disabled{opacity:.6}
.stack{display:grid;gap:10px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}
.lab{font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:.9rem;margin-bottom:6px}
.d{color:var(--mut)}
.note{color:var(--mut);font-style:italic}
.hint{color:var(--mut);font-size:.95rem;margin-top:4px}
/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px}
.pill{min-height:62px;border:2px solid var(--line);background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1rem;cursor:pointer;padding:4px 0}
.pill i{width:12px;height:12px;border-radius:50%;background:transparent;border:2px solid var(--line);display:block}
.pill i.ok{background:var(--acc);border-color:var(--acc)}.pill i.alt{background:var(--amb);border-color:var(--amb)}.pill i.skip{background:var(--skip);border-color:var(--skip)}.pill i.miss{border-color:var(--red)}
.pill.today{border-color:var(--acc)}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pill.on i{border-color:var(--onacc)}.pill.on i.ok,.pill.on i.alt,.pill.on i.skip{background:var(--onacc)}
.back{margin:0 0 12px}
.warn{background:var(--ambbg);color:var(--amb);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-weight:600}
/* progress dots */
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.dotb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:600;padding:0}
.dot{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;background:var(--card)}
.dot.ok{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.dot.alt{background:var(--ambbg);border-color:var(--amb);color:var(--amb)}
.dot.skip{background:var(--skipbg);border-color:var(--skip);color:var(--skip)}
.dot.miss{border-color:var(--red);color:var(--red)}
.dot.sm{width:36px;height:36px;border-width:2px;font-size:1.05rem}
/* logged state */
.logged{border-radius:16px;padding:14px;margin-top:14px;border:2px solid}
.logged.ok{background:var(--accbg);border-color:var(--acc)}
.logged.alt{background:var(--ambbg);border-color:var(--amb)}
.logged.skip{background:var(--skipbg);border-color:var(--skip)}
.logged .t{font-size:1.15rem;font-weight:800;display:flex;gap:8px;align-items:center}
.logged.ok .t{color:var(--acc)}.logged.alt .t{color:var(--amb)}.logged.skip .t{color:var(--skip)}
.logged .x{margin-top:4px}
/* sheet for "Noe annet" */
.sheet{margin-top:14px;padding:14px;border:2px solid var(--amb);border-radius:16px;background:var(--ambbg)}
.sheet .q{display:block;font-weight:700;margin:0 0 6px;color:var(--ink)}
.sheet input[type=text]{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;font-size:1rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.prot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.prot .chip{min-height:56px;border-radius:16px;font-weight:700}
.bad{color:var(--red);font-weight:600;margin:6px 0}
/* uke */
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:76px;padding:10px 12px;margin:0 0 10px;border:2px solid var(--line);border-left-width:8px;border-radius:16px;background:var(--card);cursor:pointer}
.wk.ok{border-left-color:var(--acc)}.wk.alt{border-left-color:var(--amb)}.wk.skip{border-left-color:var(--skip)}.wk.miss{border-left-color:var(--red)}
.wk.today{outline:3px solid var(--acc);outline-offset:1px}
.wk .wd{width:58px;flex:none}.wk .wd b{display:block;font-size:1.2rem}.wk .wd span{color:var(--mut);font-size:.9rem}
.wk .wm{flex:1;min-width:0;overflow-wrap:anywhere}.wk .wt{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk .ws{font-size:.95rem;font-weight:600}.wk .ws.ok{color:var(--acc)}.wk .ws.alt{color:var(--amb)}.wk .ws.skip{color:var(--skip)}.wk .ws.miss{color:var(--red)}
.wk .wdots{display:flex;gap:5px;flex:none}
/* handleliste */
.bar{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.prog{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.cnt{font-weight:800;white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;margin:14px 0 6px;padding:8px 4px;background:none;border:0;border-bottom:2px solid var(--line);font-weight:800;font-size:1.1rem;cursor:pointer;text-align:left}
.gh span{color:var(--mut);font-weight:700}
.it{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 12px;margin:6px 0;background:var(--card);border:2px solid var(--line);border-radius:14px;cursor:pointer}
.it input{width:32px;height:32px;flex:none;accent-color:var(--acc);margin:0}
.it .n{font-weight:700}.it .q{color:var(--mut)}.it .tag{display:inline-block;margin-top:2px;font-size:.9rem;font-weight:700;color:var(--amb);background:var(--ambbg);border-radius:8px;padding:1px 8px}
.it.got{opacity:.5}.it.got .n{text-decoration:line-through}
.reset{margin-top:26px}
/* feedback */
.stars{display:flex;justify-content:space-between;gap:4px;margin:8px 0 14px}
.star{flex:1;min-height:64px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:2.3rem;line-height:1;color:var(--line);cursor:pointer;padding:0}
.star.on{color:var(--star);border-color:var(--star)}
.fbf label.q{display:block;font-weight:700;margin:0 0 6px}
.fbf textarea{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;resize:vertical}
.picbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;margin:12px 0;border:2px dashed var(--mut);border-radius:16px;font-weight:700;cursor:pointer;background:var(--card)}
.picbtn input{display:none}
.pv{display:flex;align-items:center;gap:12px;margin:0 0 12px}.pv img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.ok-box{background:var(--accbg);border:2px solid var(--acc);color:var(--acc);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:800}
.fbi{padding:12px 0;border-top:1px solid var(--line)}.fbi:first-child{border-top:0}
.fbi .m{color:var(--mut);font-size:.95rem}.fbi .st{color:var(--star);font-size:1.2rem;letter-spacing:2px}
.fbi img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}
.msg{padding:30px;text-align:center;color:var(--mut)}
/* flere måltider */
.le{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 0;border-top:1px solid var(--line)}
.le:first-of-type{border-top:0}
.le .lt{width:56px;flex:none;text-align:center;font-weight:800;font-size:1.05rem}
.le .lm{flex:1;min-width:0}.le .ln{font-weight:700;overflow-wrap:anywhere}.le .ls{color:var(--mut);font-size:.95rem}
.le.skip{opacity:.65}
.lx{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.4rem;font-weight:800;cursor:pointer;color:var(--red);padding:0}
.cntb{font-weight:800;color:var(--acc);margin:0 0 10px}
.wk .wc{font-size:.95rem;font-weight:600;color:var(--mut)}
.sh.add{padding-bottom:0}
.sh.add .q2{display:block;font-weight:700;margin:14px 0 6px}
.sh.add input[type=text],.sh.add input[type=time]{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem}
.sh.add .chips{margin:0}
.sh.add .chip{min-height:52px}
.stickb{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-top:14px}
/* chrome */
#err{position:fixed;top:72px;border-radius:12px;margin:0 12px;left:0;right:0;z-index:30;background:var(--redbg);color:var(--red);padding:10px 14px;font-weight:700;display:none}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:var(--tb);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.72rem;color:var(--mut);border-top:4px solid transparent;cursor:pointer;padding:0}
.tab b{font-size:1.6rem;line-height:1.1}
.tab.on{color:var(--acc);border-top-color:var(--acc);background:var(--accbg)}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:25;display:none;max-width:616px;margin:0 auto}
#toast .ts{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 18px;font-weight:800;font-size:1.1rem;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast{pointer-events:none}#toast button{pointer-events:auto;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh .top .btn{width:auto;min-width:56px;min-height:56px;flex:none}
/* v5: plan, retter, handleliste */
.row{display:flex;gap:10px;align-items:center}
.wkn{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center;margin:0 0 12px}
.wkn .btn{min-height:60px;padding:0;font-size:1.4rem}
.wkn .c{text-align:center}.wkn .c b{display:block;font-size:1.25rem}.wkn .c span{color:var(--mut);font-size:.95rem}
.pday{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:0 0 12px}
.pday.today{border-color:var(--acc)}
.pday .ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.pday .ph b{font-size:1.15rem}.pday .ph span{color:var(--mut);font-size:.95rem}
.pe{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:8px 10px;margin:6px 0;border:2px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;cursor:pointer}
.pe .ic{font-size:1.4rem;flex:none;width:32px;text-align:center}
.pe .pm{flex:1;min-width:0}.pe .pn{font-weight:700;overflow-wrap:anywhere}.pe .ps{color:var(--mut);font-size:.95rem}
.pe.ok{border-color:var(--acc)}.pe.alt{border-color:var(--amb)}.pe.skip{opacity:.6}
.addd{border-style:dashed;color:var(--acc);font-weight:700;justify-content:center;background:none}
.badge{display:inline-block;font-size:.85rem;font-weight:800;border-radius:8px;padding:1px 8px;margin-right:4px;vertical-align:1px}
.badge.liker{background:var(--accbg);color:var(--acc)}.badge.prøv{background:var(--ambbg);color:var(--amb)}.badge.fav{background:#fff2c2;color:#7a5200}
@media(prefers-color-scheme:dark){.badge.fav{background:#3d3210;color:#ffd667}}
.rc{display:block;width:100%;text-align:left;min-height:68px;padding:10px 12px;margin:0 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.rc .rn{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}.rc .rm{color:var(--mut);font-size:.95rem;margin-top:2px}
.rc.hid{opacity:.55}
.srch{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.1rem;margin:0 0 10px}
.fl{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;margin:0 0 4px;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}
.fl .chip{flex:none}
.inp{width:100%;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem}
textarea.inp{min-height:120px;resize:vertical}
select.inp{appearance:auto}
.lbl{display:block;font-weight:700;margin:14px 0 6px}
.ingr{border:2px solid var(--line);border-radius:14px;padding:10px;margin:0 0 8px;background:var(--card)}
.ingr .g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ingr .hh{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.ingr .hh input{width:28px;height:28px;accent-color:var(--acc)}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.step .btn{min-height:60px;font-size:1.6rem;padding:0}.step b{text-align:center;font-size:1.3rem}
.ilist{margin:6px 0 0;padding:0;list-style:none}.ilist li{padding:6px 0;border-top:1px solid var(--line)}.ilist li:first-child{border-top:0}
.ilist .h{color:var(--amb);font-weight:700;font-size:.9rem}
.steps{white-space:pre-line}
.it .rr{display:block;color:var(--mut);font-size:.9rem;margin-top:2px}
.it .ix{margin-left:auto;flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--red);font-weight:800;font-size:1.2rem}
.sum{background:var(--accbg);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-weight:600}
.lists .chip{text-align:left}
.pt{font-size:.95rem;color:var(--mut);margin-top:4px}
.tab{font-size:.78rem}
</style>
</head>
<body>
<div id="err"></div>
<main id="view"><div class="msg">Laster …</div></main>
<div id="toast"></div>
<div id="modal"></div>
<nav class="tb">
  <button class="tab on" data-t="idag"><b>🏠</b>I dag</button>
  <button class="tab" data-t="plan"><b>📅</b>Plan</button>
  <button class="tab" data-t="handle"><b>🛒</b>Handle</button>
  <button class="tab" data-t="retter"><b>📖</b>Retter</button>
  <button class="tab" data-t="fb"><b>💬</b>Feedback</button>
</nav>
<script>
const URL_ = "https://yhzgdipjpdmovegbkybx.supabase.co", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloemdkaXBqcGRtb3ZlZ2JreWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY5NzcsImV4cCI6MjEwNTkxMjk3N30.13nVIkVWVIb-fh7oPKA1tHdCeX8tKqIpVi_o80rXIo4";
const H = {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json"};
const TABS = ["idag", "plan", "handle", "retter", "fb"];
const DK = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const DL = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const SLOTS = [["frokost","Frokost","🥣"],["lunsj","Lunsj","🥪"],["middag","Middag","🍽️"],["snack","Mellommåltid","🍌"],["kvelds","Kvelds","🌙"]];
const SL = Object.fromEntries(SLOTS.map(s => [s[0], s[1]])), SI = Object.fromEntries(SLOTS.map(s => [s[0], s[2]]));
const SORD = SLOTS.map(s => s[0]);
const KINDS = [["middag","Middag"],["frokost","Frokost"],["lunsj","Lunsj"],["snack","Snack"]];
const KL = Object.fromEntries(KINDS);
const EQ = [["airfryer","Airfryer"],["riskoker","Riskoker"],["wok","Wok"],["ovn","Ovn"],["stekepanne","Stekepanne"],["kjele","Kjele"],["mikro","Mikro"]];
const EQL = Object.fromEntries(EQ);
const CATS = ["Kjøtt, fisk og egg","Meieri","Grønnsaker og frukt","Brød","Tørrvarer","Frys","Hermetikk og glass","Krydder, saus og olje","Annet"];
const UNITS = ["g","kg","stk","dl","l","ml","ss","ts","pk","boks","glass","pose","beger","skive","fl"];
const GOAL = {kcal: [2100, 2300], prot: [130, 150]};

let recipes = [], plan = [], entries = [], fb = [], lists = [], items = [];
let tab = "idag", sel = ds(new Date()), viewMon = monday(ds(new Date())), curList = null, M = null, loaded = false;
const drafts = {}, logDraft = {}, logOpen = new Set(), catOpen = {}, showRec = new Set();
let RF = {q: "", tag: "", kind: "", time: 0, eq: ""};
let shopF = {from: ds(new Date()), days: 7, to: null, preview: null, busy: false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const err = m => { const e = $("#err"); e.textContent = m || ""; e.style.display = m ? "block" : "none"; if (m) setTimeout(() => err(), 6000); };
const R = id => recipes.find(r => r.id === id);

/* ---------- datoer ---------- */
function ds(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function add(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function monday(s) { const d = pd(s); return add(s, -((d.getDay() + 6) % 7)); }
const today = () => ds(new Date());
const wd = s => (pd(s).getDay() + 6) % 7;
const fmt = (s, o) => pd(s).toLocaleDateString("nb-NO", o || {day: "numeric", month: "short"});
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);

const relDay = s => { const n = diffDays(today(), s); return n === 0 ? "I dag" : n === -1 ? "I går" : n === 1 ? "I morgen" : ""; };
const num = q => q == null ? "" : String(+(+q).toFixed(2)).replace(".", ",");

/* ---------- data ---------- */
async function api(path, opts) {
  const r = await fetch(URL_ + "/rest/v1/" + path, {headers: H, ...opts});
  if (!r.ok) throw new Error(r.status + " " + await r.text());
  return r.status === 204 ? null : r.json();
}
const rpc = (n, b) => api("rpc/" + n, {method: "POST", body: JSON.stringify(b || {})});
let writeSeq = 0, pending = 0, lastSig = "";
async function fetchPlan() {
  const tm = monday(today()), sm = monday(sel);
  const ws = [...new Set([tm, viewMon, sm])];
  const all = (await Promise.all(ws.map(w => rpc("plan_list", {p_from: w, p_to: add(w, 6)})))).flat(), seen = new Set();
  return all.filter(x => !seen.has(x.id) && seen.add(x.id));
}
async function load() {
  const seq = writeSeq;
  try {
    const sm = monday(sel);
    const res = await Promise.all([rpc("recipes_list"), fetchPlan(), rpc("list_entries", {p_from: sm, p_to: add(sm, 6)}),
      rpc("list_feedback_recent", {p_limit: 100}).catch(() => fb), rpc("shop_lists").catch(() => lists)]);
    const ls = res[4];
    let cl = curList;
    if (cl == null || !ls.some(l => l.id === cl)) cl = ls[0] ? ls[0].id : null;
    const it = cl ? await rpc("shop_items", {p_list: cl}) : [];
    if (loaded && (pending > 0 || seq !== writeSeq)) return;
    const sig = JSON.stringify([res, it]), same = sig === lastSig; lastSig = sig;
    [recipes, plan, entries, fb, lists] = res; items = it; curList = cl; loaded = true;
    err();
    if (same && $("#view").children.length && !$("#view .msg.loading")) return;
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches("textarea, input[type=text], input[type=search], input[type=number], input[type=date]")) return;
    render();
  } catch (e) { err("Kunne ikke hente data. Prøv å laste siden på nytt."); console.error(e); }
}
async function refreshPlan() { try { plan = await fetchPlan(); } catch (e) { console.error(e); } }
async function write(fn, failMsg) {
  writeSeq++; pending++;
  try { const r = await fn(); err(); return r; }
  catch (e) { console.error(e); err(failMsg || "Kunne ikke lagre! Sjekk nettforbindelsen og prøv igjen."); throw e; }
  finally { pending--; writeSeq++; lastSig = ""; }
}

/* ---------- toast ---------- */
let toastTimer = null, toastUndo = null;
function showToast(msg, undo) {
  toastUndo = undo || null;
  $("#toast").innerHTML = `<div class="ts"><span>${esc(msg)}</span>${undo ? `<button data-toastundo>↩ Angre</button>` : ""}</div>`;
  $("#toast").style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toast").style.display = "none"; toastUndo = null; }, 6000);
}

/* ---------- plan-handlinger ---------- */
async function planAdd(date, slot, rid, portions, quiet) {
  const r = R(rid);
  let id;
  try { id = await write(() => rpc("plan_add", {p_date: date, p_slot: slot, p_recipe: rid, p_portions: portions || null}), "Kunne ikke legge til. Prøv igjen."); } catch (_) { render(); return null; }
  await refreshPlan();
  if (!quiet) showToast("✓ " + (r ? r.name : "Lagt til") + " – " + DK[wd(date)] + " " + fmt(date), () => planRemove(id, true));
  render(); return id;
}
async function planRemove(id, isUndo) {
  const e0 = plan.find(x => x.id === id); if (!e0) return;
  const prev = plan; plan = plan.filter(x => x.id !== id); render();
  try { await write(() => rpc("plan_remove", {p_id: id}), "Kunne ikke fjerne. Prøv igjen."); }
  catch (_) { plan = prev; render(); return; }
  if (isUndo) showToast("Angret");
  else showToast("Fjernet fra planen", async () => { await planAdd(e0.date, e0.slot, e0.recipe_id, e0.portions, true); showToast("Lagt tilbake"); });
}
async function planUpdate(id, ch) {
  const e0 = plan.find(x => x.id === id); if (!e0) return;
  const old = {date: e0.date, slot: e0.slot, portions: e0.portions};
  Object.assign(e0, ch); render();
  try { await write(() => rpc("plan_update", {p_id: id, p_date: ch.date || null, p_slot: ch.slot || null, p_portions: ch.portions || null})); }
  catch (_) { Object.assign(e0, old); render(); }
}
function planOf(date) { return plan.filter(p => p.date === date).sort((a, b) => SORD.indexOf(a.slot) - SORD.indexOf(b.slot) || a.id - b.id); }

/* ---------- logging (plan-rader) ---------- */
const SC = {som_planlagt: "ok", endret: "alt", hoppet_over: "skip"};
const PROT = {lite: "Lite protein", greit: "Greit", mye: "Mye protein"};
const FILL = ["Pizza", "Rester", "Kylling og ris", "Takeaway"];
const pe = k => plan.find(p => p.id === +k.split(":")[1]);
async function saveLog(k, st, text, protein, quiet) {
  const r = pe(k); if (!r) return;
  const prev = {status: r.status ?? null, actual_text: r.actual_text ?? null, actual_protein: r.actual_protein ?? null};
  Object.assign(r, {status: st, actual_text: text, actual_protein: protein});
  logOpen.delete(k); render();
  if (!quiet) showToast(st ? "✓ Lagret" : "Angret", st ? () => saveLog(k, prev.status, prev.actual_text, prev.actual_protein, true) : null);
  else showToast("Angret");
  try { await write(() => rpc("plan_log", {p_id: r.id, p_status: st, p_actual: text, p_protein: protein})); }
  catch (_) { Object.assign(r, prev); $("#toast").style.display = "none"; render(); }
}
function statusText(r) {
  if (r.status === "som_planlagt") return "Spist som planlagt";
  if (r.status === "endret") return "Spist: " + (r.actual_text || "noe annet");
  if (r.status === "hoppet_over") return "Hoppet over";
  return "";
}
function loggedBox(k) {
  const r = pe(k), c = SC[r.status];
  return `<div class="logged ${c}"><div class="t"><span>${r.status === "hoppet_over" ? "–" : "✓"}</span><span>Lagret</span></div>
    <div class="x"><b>${esc(statusText(r))}</b>${r.actual_protein ? " · " + PROT[r.actual_protein] : ""}</div>
    <div class="grid2"><button class="btn sm" data-other data-lk="${k}">✎ Endre</button><button class="btn sm" data-set="" data-lk="${k}">↩ Angre</button></div></div>`;
}
function logSheet(k) {
  const d = logDraft[k] || (logDraft[k] = {text: "", protein: null, bad: ""}), id = "lt-" + k.replace(":", "");
  return `<div class="sheet" data-lk="${k}"><label class="q" for="${id}">Hva spiste du?</label>
    <input type="text" id="${id}" class="lgi" maxlength="200" enterkeyhint="done" placeholder="F.eks. pizza" value="${esc(d.text)}">
    <div class="chips">${FILL.map(f => `<button class="chip" data-fill="${esc(f)}">${esc(f)}</button>`).join("")}</div>
    <label class="q" style="margin-top:10px">Hvor mye protein? <span class="d">(valgfritt)</span></label>
    <div class="prot">${Object.keys(PROT).map(p => `<button class="chip ${d.protein === p ? "on" : ""}" data-prot="${p}">${PROT[p]}</button>`).join("")}</div>
    ${d.bad ? `<div class="bad">${esc(d.bad)}</div>` : ""}
    <div class="stack" style="margin-top:0"><button class="btn go" data-logsave>Lagre</button><button class="btn sm" data-cancel data-lk="${k}">Avbryt</button></div></div>`;
}
function logButtons(k) {
  const r = pe(k);
  if (logOpen.has(k)) return logSheet(k);
  if (r.status) return loggedBox(k);
  return `<div class="stack"><button class="btn go" data-set="som_planlagt" data-lk="${k}">✓ Spist som planlagt</button>
    <div class="grid2" style="margin-top:0"><button class="btn alt" data-other data-lk="${k}">Noe annet</button>

}

function filterRecipes(f) {
  const q = (f.q || "").trim().toLowerCase();
  return recipes.filter(r => (f.tag === "hidden" ? r.hidden : !r.hidden)
    && (!f.tag || f.tag === "hidden" || (f.tag === "fav" ? r.favorite : r.tag === f.tag))

/* ---------- Plan ---------- */

function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function resize(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.8);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Kunne ikke lese bildet")); };
    im.src = u;
  });
}
async function send(k) {
  const x = dr(k); if (x.busy) return;
  const comment = x.comment.trim();
  if (!comment && !x.rating && !x.file) { x.bad = "Gi stjerner, skriv noe eller legg ved et bilde."; x.ok = false; return render(); }
  let rid = null, pid = null;
  if (k[0] === "p") { const p = pe(k); pid = p ? p.id : null; rid = p ? p.recipe_id : null; }
  if (k[0] === "r") rid = +k.slice(2);
  x.busy = true; x.bad = ""; x.ok = false; render();
  try {
    await write(async () => {
      let path = null;
      if (x.file) {
        const blob = await resize(x.file); path = "feedback/" + uid() + ".jpg";
        const r = await fetch(URL_ + "/storage/v1/object/mat-app/" + path, {method: "POST", headers: {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "image/jpeg"}, body: blob});
        if (!r.ok) throw new Error("Opplasting av bilde feilet");
      }
      await rpc("add_feedback2", {p_recipe_id: rid, p_plan_entry_id: pid, p_rating: x.rating || null, p_comment: comment, p_photo_path: path});
    }, "Kunne ikke sende. Sjekk nettforbindelsen og prøv igjen.");
    if (x.url) URL.revokeObjectURL(x.url);
    drafts[k] = {rating: 0, comment: "", file: null, url: null, busy: false, ok: true, bad: ""};
    fb = await rpc("list_feedback_recent", {p_limit: 100}).catch(() => fb);
  } catch (e) { x.busy = false; x.bad = "Kunne ikke sende. Sjekk nettforbindelsen og prøv igjen."; }
  render();
}

}
function openEdit(id) {

}
async function saveRecipe() {

function renderModal() {

}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.t === tab));
  if (!loaded) { renderModal(); return; }
  const f = {idag: viewIdag, plan: viewPlan, handle: viewHandle, retter: viewRetter, fb: viewFb}[tab];
  const ae = document.activeElement, fid = ae && ae.id && $("#view").contains(ae) ? ae.id : null, ss = fid ? ae.selectionStart : null;

function go(t) { tab = t; history.replaceState(null, "", "#" + t); render(); scrollTo(0, 0); }
async function changeWeek(n) { viewMon = n === 0 ? monday(today()) : add(viewMon, 7 * n); render(); await refreshPlan(); render(); }
function openPick(date, slot, swap) { M = {t: "pick", date, slot, swap: swap || null, f: {q: "", tag: "", kind: kindForSlot(slot), time: 0, eq: ""}}; render(); }

async function swapEntry(oldId, rid) {
  const old = plan.find(p => p.id === oldId); M = null; if (!old) return render();

  await refreshPlan(); render();
  showToast("✓ Byttet til " + R(rid).name, async () => { await write(() => rpc("plan_remove", {p_id: nid})).catch(() => {}); await planAdd(old.date, old.slot, old.recipe_id, old.portions, true); showToast("Angret"); });
}
function setFlag(r, k, v, msg, undo) {
  r[k] = v; render(); showToast(msg, undo);
  write(() => rpc("recipe_flags", {p_id: r.id, p_favorite: k === "favorite" ? v : null, p_hidden: k === "hidden" ? v : null})).catch(() => { r[k] = !v; render(); });
}

/* ---------- events ---------- */

    if (M.pl && (e = c("[data-pld]"))) { M.pl.date = e.dataset.pld; return render(); }
    if (M.pl && (e = c("[data-plwk]"))) { const n = +e.dataset.plwk; M.pl.mon = add(M.pl.mon, n); M.pl.date = add(M.pl.date, n); return render(); }
    if (M.pl && (e = c("[data-pls]"))) { M.pl.slot = e.dataset.pls; return render(); }

  }
  if (M && M.t === "edit") {

    if (c("[data-iadd]")) { x.ing.push({name: "", qty: "", unit: "g", category: "Annet", at_home: false}); render(); const all = document.querySelectorAll(".ingr input[data-if=name]"); if (all.length) all[all.length - 1].focus(); return; }

  }

  if ((e = c("[data-edit]"))) return openEdit(+e.dataset.edit);
  if (c("[data-newrec]")) { M = null; return openEdit(null); }
  if ((e = c("[data-fb]"))) { M = {t: "fb", k: e.dataset.fb, back: M && M.t === "recipe" ? M : null}; dr(M.k).ok = false; return render(); }
  // I dag
  if ((e = c("[data-sel]"))) { const old = monday(sel); sel = e.dataset.sel; render(); if (monday(sel) !== old) load(); return; }

    if ((e = c("[data-fill]"))) { d.text = e.dataset.fill; d.bad = ""; return render(); }
    if ((e = c("[data-prot]"))) { d.protein = d.protein === e.dataset.prot ? null : e.dataset.prot; return render(); }
    if (c("[data-logsave]")) { if (!d.text.trim()) { d.bad = "Skriv kort hva du spiste."; return render(); } return saveLog(k, "endret", d.text.trim(), d.protein); }

let qTimer = null;
document.addEventListener("input", ev => {

document.addEventListener("keydown", ev => {

document.addEventListener("change", ev => {
