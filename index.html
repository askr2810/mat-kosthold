<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f855a">
<title>Mat og handleliste</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2933;--mut:#6b7280;--acc:#2f855a;--acc2:#e6f4ec;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--card:#1a211d;--ink:#e8ece9;--mut:#9aa6a0;--acc:#48bb78;--acc2:#1f3a2b;--line:#2b3530}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 0;border-bottom:1px solid var(--line)}
h1{font-size:1.2rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-weight:400;color:var(--mut);font-size:.8rem}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:10px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--acc);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:14px}
section[hidden]{display:none}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:first-child{border-top:0}
.row input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600}
.row .d,.row .note{color:var(--mut);font-size:.9rem}
.row .note{font-style:italic}
.row.done .n{text-decoration:line-through;color:var(--mut)}
.row.done .d{opacity:.6}
.day{flex:none;width:36px;font-weight:700;color:var(--acc);padding-top:2px}
.info{padding:12px 14px;border-top:1px solid var(--line)}
.info:first-child{border-top:0}
.info b{display:block}
.goal b{display:block}.goal{background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.prog{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.cnt{font-weight:700;white-space:nowrap}
button.reset{margin-top:22px;width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.msg{padding:30px;text-align:center;color:var(--mut)}
.mw{border-top:1px solid var(--line)}.mw:first-child{border-top:0}
.fbbar{padding:0 14px 12px 62px}
.fbbtn{border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:18px;padding:6px 12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.fbbtn.on{background:var(--acc2)}
.fbp{margin:0 14px 14px;padding:12px;background:var(--acc2);border-radius:12px}
.fbf label.q{display:block;font-weight:600;margin:0 0 6px}
.stars{display:flex;gap:2px;margin-bottom:10px}
.star{border:0;background:none;font-size:2rem;line-height:1;padding:2px 4px;color:var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.star.on{color:#f5a623}
.fbf textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.fbf .cc{font-size:.75rem;color:var(--mut);text-align:right}
.fbf .pic{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.fbf .picbtn{display:inline-block;border:1px dashed var(--mut);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;background:var(--card)}
.fbf .picbtn input{display:none}
.fbf .pn{font-size:.85rem;color:var(--mut);word-break:break-all}
.fbf .x{border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer}
.send{width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6}
.ok{background:var(--card);border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.bad{color:#9b1c1c;font-size:.9rem;margin:6px 0}
.fbi{padding:10px 0;border-top:1px solid var(--line)}
.fbi:first-of-type{border-top:0}
.fbi .m{font-size:.8rem;color:var(--mut)}
.fbi .st{color:#f5a623;letter-spacing:1px}
.fbi img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:6px}
.fbprev{margin-top:12px}.fbprev h3{font-size:.8rem;color:var(--mut);margin:0 0 2px;text-transform:uppercase;letter-spacing:.05em}
.fbcard{padding:6px 14px}
.qb{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 11px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.sm{padding:5px 9px;font-size:.78rem}
.act{flex-basis:100%;font-size:.88rem;color:var(--ink)}
.act i{color:var(--mut);font-style:normal}
.lgp{margin:0 14px 12px;padding:10px;background:var(--acc2);border-radius:12px}
.lgp input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.lgp .prot{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center;font-size:.8rem;color:var(--mut)}
.lgp .undo{border:0;background:none;color:var(--mut);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;margin-top:6px}
.pills{display:flex;gap:4px;padding:10px 14px 4px}
.pill{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 0;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lr{border-top:1px solid var(--line);padding-top:10px}.lr:first-of-type{border-top:0}
.lr .lt{padding:0 14px 6px;font-weight:600}
#err{background:#fde8e8;color:#9b1c1c;padding:8px 14px;display:none;font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1><span>Mat og handleliste</span><small id="wk"></small></h1>
  <div class="tabs"><button class="tab on" data-t="plan">Ukeplan</button><button class="tab" data-t="list">Handleliste</button><button class="tab" data-t="fb">Tilbakemelding</button></div>
</header>
<div id="err"></div>
<main>
  <section id="plan"><div class="msg">Laster …</div></section>
  <section id="list" hidden><div class="msg">Laster …</div></section>
  <section id="fb" hidden></section>
</main>
<script>
const URL_ = "https://yhzgdipjpdmovegbkybx.supabase.co", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloemdkaXBqcGRtb3ZlZ2JreWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY5NzcsImV4cCI6MjEwNTkxMjk3N30.13nVIkVWVIb-fh7oPKA1tHdCeX8tKqIpVi_o80rXIo4";
const H = {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json"};
const DAYS = {Man:"Mandag",Tir:"Tirsdag",Ons:"Onsdag",Tor:"Torsdag",Fre:"Fredag","Lør":"Lørdag","Søn":"Søndag"};
let week = null, meals = [], items = [], fb = [], dayLog = [];
const drafts = {}, openP = new Set(), logDraft = {}, logOpen = new Set();
const DAYK = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
let logDay = DAYK[(new Date().getDay() + 6) % 7];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const err = m => { const e = $("#err"); e.textContent = m || ""; e.style.display = m ? "block" : "none"; };

async function api(path, opts) {
  const r = await fetch(URL_ + "/rest/v1/" + path, {headers: H, ...opts});
  if (!r.ok) throw new Error(r.status + " " + await r.text());
  return r.status === 204 ? null : r.json();
}
async function load() {
  try {
    const w = await api("mat_meal_plan?select=week&order=week.desc&limit=1");
    week = w[0]?.week;
    if (!week) { meals = []; items = []; render(); return; }
    const q = "week=eq." + encodeURIComponent(week);
    [meals, items, fb, dayLog] = await Promise.all([
      api("mat_meal_plan?select=*&order=sort&" + q),
      api("mat_shopping_items?select=*&order=sort&" + q),
      api("rpc/list_feedback", {method: "POST", body: JSON.stringify({p_week: week})}).catch(() => fb),
      api("rpc/list_day_log", {method: "POST", body: JSON.stringify({p_week: week})}).catch(() => dayLog)]);
    err();
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches("textarea, input[type=text]")) return; // ikke avbryt skriving
    render();
  } catch (e) { err("Kunne ikke hente data. Prøv å laste siden på nytt."); console.error(e); }
}
function weekLabel(w) { const m = /(\d+)-W(\d+)/.exec(w || ""); return m ? "Uke " + +m[2] : (w || ""); }

function row(cls, id, checked, title, desc, note, lead) {
  return `<label class="row ${checked ? "done" : ""}" data-id="${id}">${lead || ""}<input type="checkbox" ${checked ? "checked" : ""}>
  <span class="t"><span class="n">${esc(title)}</span>${desc ? `<div class="d">${esc(desc)}</div>` : ""}${note ? `<div class="note">${esc(note)}</div>` : ""}</span></label>`;
}
function render() {
  $("#wk").textContent = weekLabel(week);
  const by = t => meals.filter(m => m.meal_type === t);
  const info = m => `<div class="info"><b>${esc(m.title)}</b>${m.description ? `<span class="d">${esc(m.description)}</span>` : ""}</div>`;
  let h = "";
  const goal = by("mål");
  if (goal.length) h += `<div class="goal">${goal.map(g => `<b>${esc(g.title)}</b>${esc(g.description)}`).join("<br>")}</div>`;
  if (by("frokost").length) h += `<h2>Frokost (velg ett)</h2><div class="card">${by("frokost").map(info).join("")}</div>`;
  if (by("mellommåltid").length) h += `<h2>Mellommåltid</h2><div class="card">${by("mellommåltid").map(info).join("")}</div>`;
  const lt = ["frokost", "mellommåltid"].filter(t => by(t).length);
  if (lt.length) h += `<h2>Logg frokost og mellommåltid</h2><div class="card"><div class="pills">${DAYK.map(d => `<button class="pill ${d === logDay ? "on" : ""}" data-logday="${d}">${d}</button>`).join("")}</div>${lt.map(t => `<div class="lr"><div class="lt">${t === "frokost" ? "Frokost" : "Mellommåltid"}</div>${logBar("d:" + logDay + ":" + t)}</div>`).join("")}</div>`;
  const din = by("middag");
  if (din.length) {
    const d = din.filter(m => m.done).length;
    h += `<h2>Middager · ${d}/${din.length} spist</h2><div class="card">${din.map(m => {
      const n = fb.filter(f => f.meal_id === m.id).length, k = String(m.id), o = openP.has(k);
      return `<div class="mw"><label class="row ${m.done ? "done" : ""}" data-meal="${m.id}"><span class="day">${esc(m.day)}</span><span class="t"><span class="n">${esc(m.title)}</span>${m.description ? `<div class="d">${esc(m.description)}</div>` : ""}${m.protein_note ? `<div class="note">${esc(m.protein_note)}</div>` : ""}</span><input type="checkbox" ${m.done ? "checked" : ""} aria-label="Spist"></label>
      ${logBar("m:" + m.id)}<div class="qb"><button class="fbbtn ${o ? "on" : ""}" data-fbopen="${k}">💬 Tilbakemelding${n ? " (" + n + ")" : ""}</button></div>${o ? panel(k, m) : ""}</div>`;
    }).join("")}</div>`;
  }
  $("#plan").innerHTML = h || `<div class="msg">Ingen plan ennå.</div>`;
  renderFb();

  if (!items.length) { $("#list").innerHTML = `<div class="msg">Ingen handleliste ennå.</div>`; return; }
  const got = items.filter(i => i.checked).length;
  const cats = [...new Set(items.map(i => i.category))];
  h = `<div class="bar"><div class="prog"><i style="width:${Math.round(got / items.length * 100)}%"></i></div><span class="cnt">${got} av ${items.length} kjøpt</span></div>`;
  for (const c of cats) {
    const its = items.filter(i => i.category === c), g = its.filter(i => i.checked).length;
    h += `<h2>${esc(c)} · ${g}/${its.length}</h2><div class="card">${its.map(i =>
      row("", i.id, i.checked, i.name + (i.quantity ? " – " + i.quantity : ""), "", i.note)).join("")}</div>`;
  }
  h += `<button class="reset" id="reset">Nullstill avkryssing</button>`;
  $("#list").innerHTML = h;
}


/* ---------- Tilbakemelding ---------- */
const PHOTO = p => URL_ + "/storage/v1/object/public/mat-app/" + p;
const dr = k => drafts[k] || (drafts[k] = {rating: 0, comment: "", file: null, busy: false, ok: false, bad: ""});
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
function fbItem(f) {
  const d = new Date(f.created_at).toLocaleString("nb-NO", {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  return `<div class="fbi"><div class="m">${esc(d)}${f.kind === "meal" && f.meal_title ? " · " + esc(f.meal_title) : ""}</div>
  ${f.rating ? `<div class="st" aria-label="${f.rating} av 5">${stars(f.rating)}</div>` : ""}
  ${f.comment ? `<div>${esc(f.comment).replace(/\n/g, "<br>")}</div>` : ""}
  ${f.photo_path ? `<a href="${esc(PHOTO(f.photo_path))}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(PHOTO(f.photo_path))}" alt="Bilde"></a>` : ""}</div>`;
}
function form(k, meal) {
  const x = dr(k);
  return `<div class="fbf" data-k="${k}">
  ${x.ok ? `<div class="ok">Takk! Tilbakemeldingen er sendt ✓</div>` : ""}
  ${meal ? `<label class="q">Hvor god var den?</label><div class="stars">${[1,2,3,4,5].map(i => `<button type="button" class="star ${x.rating >= i ? "on" : ""}" data-star="${i}" aria-label="${i} stjerner">★</button>`).join("")}</div>` : ""}
  <label class="q" for="c-${k}">${meal ? "Hvordan var det?" : "Tilbakemelding"}</label>
  <textarea id="c-${k}" maxlength="2000" placeholder="${meal ? "Hvordan var det? For tørt, for mye, lett å lage, hva vil du ha mer/mindre av?" : "Hva fungerer, hva vil du ha mer/mindre av neste uke, ønsker, ting du har laget …"}">${esc(x.comment)}</textarea>
  <div class="pic"><label class="picbtn">📷 ${x.file ? "Bytt bilde" : "Legg til bilde"}<input type="file" accept="image/*"></label>${x.file ? `<span class="pn">${esc(x.file.name || "bilde")}</span><button type="button" class="x" data-rmpic aria-label="Fjern bilde">✕</button>` : ""}</div>
  ${x.bad ? `<div class="bad">${esc(x.bad)}</div>` : ""}
  <button type="button" class="send" data-send ${x.busy ? "disabled" : ""}>${x.busy ? "Sender …" : "Send"}</button></div>`;
}
function panel(k, m) {
  const prev = fb.filter(f => f.meal_id === m.id);
  return `<div class="fbp">${form(k, true)}${prev.length ? `<div class="fbprev"><h3>Tidligere</h3>${prev.map(fbItem).join("")}</div>` : ""}</div>`;
}
function renderFb() {
  const gen = fb.filter(f => f.kind === "general");
  $("#fb").innerHTML = `<h2>Generell tilbakemelding</h2><div class="card fbcard" style="padding:12px 14px">${form("g", false)}</div>
  <h2>Denne uka (${esc(weekLabel(week))})</h2><div class="card fbcard">${fb.length ? fb.map(fbItem).join("") : `<div class="msg" style="padding:14px">Ingen tilbakemeldinger ennå.</div>`}</div>`;
}
function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function resize(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.8);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Kunne ikke lese bildet")); };
    im.src = u;
  });
}
async function send(k) {
  const x = dr(k), meal = k !== "g";
  if (x.busy) return;
  const comment = x.comment.trim();
  if (!comment && !x.rating && !x.file) { x.bad = "Skriv noe, gi stjerner eller legg ved et bilde."; x.ok = false; return refresh(); }
  x.busy = true; x.bad = ""; x.ok = false; refresh();
  try {
    let path = null;
    if (x.file) {
      const blob = await resize(x.file);
      path = "feedback/" + uid() + ".jpg";
      const r = await fetch(URL_ + "/storage/v1/object/mat-app/" + path, {method: "POST", headers: {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "image/jpeg"}, body: blob});
      if (!r.ok) throw new Error("Opplasting av bilde feilet");
    }
    await api("rpc/add_feedback", {method: "POST", body: JSON.stringify({p_week: week, p_meal_id: meal ? +k : null, p_kind: meal ? "meal" : "general", p_rating: meal && x.rating ? x.rating : null, p_comment: comment, p_photo_path: path})});
    drafts[k] = {rating: 0, comment: "", file: null, busy: false, ok: true, bad: ""};
    fb = await api("rpc/list_feedback", {method: "POST", body: JSON.stringify({p_week: week})}).catch(() => fb);
  } catch (e) {
    console.error(e);
    x.busy = false; x.bad = "Kunne ikke sende. Sjekk nettforbindelsen og prøv igjen.";
  }
  refresh();
}
function refresh() { render(); }
document.addEventListener("click", ev => {
  const t = ev.target, f = t.closest(".fbf"), k = f && f.dataset.k;
  const o = t.closest("[data-fbopen]");
  if (o) { const id = o.dataset.fbopen; openP.has(id) ? openP.delete(id) : (openP.add(id), dr(id).ok = false); return render(); }
  if (!f) return;
  const st = t.closest("[data-star]");
  if (st) { const x = dr(k), n = +st.dataset.star; x.rating = x.rating === n ? 0 : n; return render(); }
  if (t.closest("[data-rmpic]")) { dr(k).file = null; return render(); }
  if (t.closest("[data-send]")) send(k);
});
document.addEventListener("input", ev => {
  const f = ev.target.closest(".fbf"); if (f && ev.target.tagName === "TEXTAREA") { const x = dr(f.dataset.k); x.comment = ev.target.value; x.ok = false; }
});
document.addEventListener("change", ev => {
  const f = ev.target.closest(".fbf"); if (!f || ev.target.type !== "file") return;
  const x = dr(f.dataset.k); x.file = ev.target.files[0] || null; x.ok = false; x.bad = ""; render();
}, true);

/* ---------- Logg hva som ble spist ---------- */
const STAT = {som_planlagt: "✓ Som planlagt", endret: "Noe annet", hoppet_over: "Hoppet over"};
const PROT = {lite: "Lite protein", greit: "Greit", mye: "Mye protein"};
function logRec(k) {
  const [t, a, b] = k.split(":");
  return t === "m" ? meals.find(m => m.id === +a) : dayLog.find(d => d.day === a && d.meal_type === b);
}
function logBar(k) {
  const r = logRec(k) || {}, o = logOpen.has(k), e = esc(k);
  let h = `<div class="qb">${Object.keys(STAT).map(s => `<button class="chip ${r.status === s ? "on" : ""}" data-log="${s}" data-lk="${e}">${STAT[s]}</button>`).join("")}`;
  if (r.status === "endret" && !o) h += `<div class="act">Spist: <b>${esc(r.actual_text || "noe annet")}</b>${r.actual_protein ? ` <i>· ${PROT[r.actual_protein]}</i>` : ""}</div>`;
  h += `</div>`;
  if (o) {
    const d = logDraft[k] || (logDraft[k] = {text: "", protein: null, bad: ""});
    h += `<div class="lgp" data-lk="${e}"><input type="text" class="lgi" maxlength="200" enterkeyhint="done" placeholder="Hva spiste du? (pizza, rester, kylling og ris)" value="${esc(d.text)}">
    <div class="prot"><span>Proteinfølelse:</span>${Object.keys(PROT).map(p => `<button class="chip sm ${d.protein === p ? "on" : ""}" data-prot="${p}">${PROT[p]}</button>`).join("")}</div>
    ${d.bad ? `<div class="bad">${esc(d.bad)}</div>` : ""}<button class="send" data-logsave>Lagre</button>
    ${r.status ? `<button class="undo" data-logundo>Fjern logging</button>` : ""}</div>`;
  }
  return h;
}
async function saveLog(k, status, text, protein) {
  const [t, a, b] = k.split(":"), r = logRec(k), prev = r ? {...r} : null, prevLog = dayLog;
  if (t === "m") {
    if (!r) return;
    Object.assign(r, {status, actual_text: text, actual_protein: protein, done: status !== null && status !== "hoppet_over"});
  } else {
    dayLog = dayLog.filter(d => !(d.day === a && d.meal_type === b));
    if (status) dayLog.push({day: a, meal_type: b, status, actual_text: text, actual_protein: protein});
  }
  render();
  try {
    if (t === "m") await api("rpc/log_meal", {method: "POST", body: JSON.stringify({p_id: +a, p_status: status, p_actual: text, p_protein: protein})});
    else await api("rpc/log_day_meal", {method: "POST", body: JSON.stringify({p_week: week, p_day: a, p_meal_type: b, p_status: status, p_actual: text, p_protein: protein})});
    err();
  } catch (e) {
    console.error(e);
    if (t === "m") Object.assign(r, prev); else dayLog = prevLog;
    render(); err("Kunne ikke lagre. Sjekk nettforbindelsen.");
  }
}
document.addEventListener("click", ev => {
  const t = ev.target, c = t.closest("[data-log]");
  if (c) {
    const k = c.dataset.lk, s = c.dataset.log, r = logRec(k);
    if (s === "endret") {
      if (logOpen.has(k)) logOpen.delete(k);
      else { logOpen.add(k); logDraft[k] = {text: r && r.status === "endret" ? r.actual_text || "" : "", protein: r && r.actual_protein || null, bad: ""}; }
      return render();
    }
    logOpen.delete(k);
    return saveLog(k, r && r.status === s ? null : s, null, null);
  }
  const dd = t.closest("[data-logday]");
  if (dd) { logDay = dd.dataset.logday; return render(); }
  const box = t.closest(".lgp"); if (!box) return;
  const k = box.dataset.lk, d = logDraft[k];
  if (t.closest("[data-prot]")) { const p = t.closest("[data-prot]").dataset.prot; d.protein = d.protein === p ? null : p; return render(); }
  if (t.closest("[data-logundo]")) { logOpen.delete(k); return saveLog(k, null, null, null); }
  if (t.closest("[data-logsave]")) {
    if (!d.text.trim()) { d.bad = "Skriv kort hva du spiste."; return render(); }
    logOpen.delete(k); saveLog(k, "endret", d.text.trim(), d.protein);
  }
});
document.addEventListener("input", ev => {
  const b = ev.target.closest(".lgp"); if (b && ev.target.classList.contains("lgi")) { const d = logDraft[b.dataset.lk]; d.text = ev.target.value; d.bad = ""; }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("lgi")) { ev.preventDefault(); ev.target.closest(".lgp").querySelector("[data-logsave]").click(); }
});

document.addEventListener("change", async ev => {
  const row = ev.target.closest(".row"); if (!row) return;
  const on = ev.target.checked;
  const isMeal = row.dataset.meal, id = +(row.dataset.meal || row.dataset.id);
  const rec = (isMeal ? meals : items).find(x => x.id === id);
  const key = isMeal ? "done" : "checked";
  rec[key] = on; render();
  try {
    await api("rpc/" + (isMeal ? "toggle_meal" : "toggle_item"), {method: "POST", body: JSON.stringify(isMeal ? {p_id: id, p_done: on} : {p_id: id, p_checked: on})});
    err();
  } catch (e) { rec[key] = !on; render(); err("Kunne ikke lagre. Sjekk nettforbindelsen."); }
});
document.addEventListener("click", async ev => {
  if (ev.target.id !== "reset") return;
  if (!confirm("Fjerne alle avkrysninger i handlelisten?")) return;
  try { await api("rpc/mat_reset_checked", {method: "POST", body: JSON.stringify({p_week: week})}); items.forEach(i => i.checked = false); render(); }
  catch (e) { err("Kunne ikke nullstille."); }
});
const TABS = ["plan", "list", "fb"];
function showTab(t) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  TABS.forEach(n => $("#" + n).hidden = n !== t);
  history.replaceState(null, "", "#" + t);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.t));
if (TABS.includes(location.hash.slice(1))) showTab(location.hash.slice(1));
addEventListener("focus", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
